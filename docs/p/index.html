<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>You're invited · Blackout</title>
  <meta name="description" content="A party is live on Blackout tonight. See who's going and the photos from tonight.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Blackout">
  <meta property="og:title" content="You're invited to a party on Blackout ⚡">
  <meta property="og:description" content="See who's going and the photos from tonight. Tap to open.">
  <meta property="og:image" content="https://jlucaslacy-oss.github.io/blackout-app/og-party.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jlucaslacy-oss.github.io/blackout-app/og-party.jpg">
  <meta name="theme-color" content="#000000">
  <meta name="apple-itunes-app" content="app-id=6781531385">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; color: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex; flex-direction: column; align-items: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.10), transparent 60%),
        #000;
    }
    .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; flex: 1; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; letter-spacing: 4px; font-size: 15px; }
    .brand img { height: 18px; }
    .brand span { color: rgba(255,255,255,.22); margin-left: -8px; }
    .card {
      margin-top: 44px; width: 100%; text-align: center;
      background: #0d0d0d; border: 1px solid #222; border-radius: 28px;
      padding: 36px 24px 28px;
      box-shadow: 0 30px 80px rgba(255,255,255,.04);
    }
    .emoji {
      width: 104px; height: 104px; margin: 0 auto 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 56px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      box-shadow: 0 0 0 10px rgba(255,255,255,.04), 0 0 0 22px rgba(255,255,255,.02);
    }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: #888; text-transform: uppercase; }
    h1 { margin-top: 10px; font-size: 38px; line-height: 1.05; font-weight: 900; letter-spacing: -.5px; word-break: break-word; }
    .live { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #bbb; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.15); animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,255,255,.05); } }
    .code { margin-top: 22px; padding: 14px; border-radius: 16px; background: #161616; border: 1px dashed #333; }
    .code small { display: block; font-size: 11px; letter-spacing: 2px; color: #888; text-transform: uppercase; }
    .code b { display: block; margin-top: 4px; font-size: 28px; letter-spacing: 6px; font-family: ui-monospace, Menlo, monospace; }
    .btn {
      display: block; width: 100%; margin-top: 14px; padding: 17px; border-radius: 16px;
      font-size: 17px; font-weight: 800; text-decoration: none; text-align: center;
    }
    .primary { background: #fff; color: #000; margin-top: 28px; }
    .secondary { border: 1px solid #333; color: #fff; }
    .hint { margin-top: 14px; font-size: 13px; color: #777; line-height: 1.45; }
    footer { margin-top: auto; padding-top: 36px; font-size: 11px; letter-spacing: 5px; color: #555; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="../bolt.png" alt="">BLACK<span>OUT</span></div>

    <div class="card">
      <div class="emoji" id="emoji">🎉</div>
      <div class="kicker" id="kicker">You're invited</div>
      <h1 id="name">A party on Blackout</h1>
      <div class="live"><span class="dot"></span><span id="live">Live tonight on Blackout</span></div>
      <div class="code" id="codeBox" hidden><small id="codeLabel">Invite code</small><b id="code"></b></div>

      <a class="btn primary" id="open" href="https://apps.apple.com/app/id6781531385">Open in Blackout</a>
      <a class="btn secondary" id="get" href="https://apps.apple.com/app/id6781531385">Get Blackout, it's free</a>
      <p class="hint" id="hint">Don't have the app? Download it, then tap “Open in Blackout” again to jump into the party.</p>
    </div>

    <footer>WHERE THE NIGHT LIVES</footer>
  </div>

  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var id = (q.get("id") || "").replace(/[^0-9a-fA-F-]/g, "");
      var name = (q.get("n") || "").slice(0, 60);
      var emoji = (q.get("e") || "").slice(0, 8);
      var code = (q.get("c") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 12);
      var es = (navigator.language || "").toLowerCase().indexOf("es") === 0;
      var T = es
        ? { kicker: "Estás invitado", live: "En vivo hoy en Blackout", open: "Abrir en Blackout",
            get: "Descargar Blackout, es gratis", codeLabel: "Código de invitación", fallback: "Una peda en Blackout",
            hint: "¿No tienes la app? Descárgala y vuelve a tocar “Abrir en Blackout” para entrar a la peda." }
        : null;
      function set(elId, text) { document.getElementById(elId).textContent = text; }
      if (T) {
        set("kicker", T.kicker); set("live", T.live); set("open", T.open); set("get", T.get);
        set("codeLabel", T.codeLabel); set("hint", T.hint); set("name", T.fallback);
        document.documentElement.lang = "es";
      }
      if (name) { set("name", name); document.title = name + " · Blackout"; }
      if (emoji) set("emoji", emoji);
      if (code) { set("code", code.toUpperCase()); document.getElementById("codeBox").hidden = false; }
      if (id) document.getElementById("open").href = "blackout://peda/" + id;
    })();
  </script>
</body>
</html>
